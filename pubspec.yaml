name: sales_odoo_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter_native_splash: ^2.4.7
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^17.5.0
  get_it: ^9.3.0
  equatable: ^3.0.0
  xml_rpc: ^0.5.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.2
  skeletonizer: ^3.0.0

dev_dependencies:
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/logo.png"
  color_dark: "#0F172A"
  image_dark: "assets/images/logo.png"
  android: true
  ios: true
